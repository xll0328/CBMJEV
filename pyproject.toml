[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cbmjev"
version = "0.1.0"
description = "Research implementation of auditable adaptive concept acquisition"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "Wenshuo Chen"},
  {name = "Lujundong Li"},
  {name = "Songning Lai"},
]
requires-python = ">=3.9"
dependencies = ["torch>=2.2", "numpy>=1.24", "Pillow>=9"]

[project.optional-dependencies]
vision = ["torchvision>=0.17"]
hf = ["transformers>=4.51", "accelerate>=1.0", "safetensors>=0.4"]
data = ["pyarrow>=12"]
paper = ["matplotlib>=3.8", "PyMuPDF>=1.23", "pikepdf>=8"]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/xll0328/CBMJEV"
Documentation = "https://github.com/xll0328/CBMJEV/blob/main/docs/QUICKSTART.md"
Issues = "https://github.com/xll0328/CBMJEV/issues"

[project.scripts]
cbmjev = "cbmjev.cli:main"

[tool.setuptools.packages.find]
include = ["cbmjev*"]

[tool.pytest.ini_options]
testpaths = ["tests_cbmjev"]
