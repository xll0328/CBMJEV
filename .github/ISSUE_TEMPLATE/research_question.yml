name: Research question
description: Discuss methodology, assumptions, results, or a reproducibility question.
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Cite the relevant paper section, equation, figure, or result artifact.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Context or evidence
      description: For results, distinguish synthetic tests, validation, and held-out test data.
