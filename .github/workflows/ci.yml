name: CPU checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Environment and CLI
        run: |
          python -m cbmjev --help
          python -m cbmjev doctor --check-device cpu
      - name: Unit and protocol tests
        run: python -m unittest discover -s tests_cbmjev -q
      - name: Documentation and structured-file checks
        run: python tools/verify_bundle.py
      - name: Keep the full manuscript out of this code release
        run: |
          python - <<'PY'
          import subprocess
          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          assert not any(p.startswith("paper/") or p.startswith("CBMJEV_arXiv_") for p in files), "Full manuscript must stay outside this code release"
          PY
      - name: Numerical theory checks
        run: |
          python theory/check_theory_sanity.py
          python theory/check_theory_extensions.py
      - name: Synthetic end-to-end smoke
        run: python -m cbmjev smoke --out "${{ runner.temp }}/cbmjev-smoke" --seed 17
